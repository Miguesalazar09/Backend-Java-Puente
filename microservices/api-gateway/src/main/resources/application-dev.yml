spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: favorites-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/favorites/**
        - id: external-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/external/**

server:
  port: 8080
