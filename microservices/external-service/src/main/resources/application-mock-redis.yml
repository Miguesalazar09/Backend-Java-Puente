server:
  port: 8083

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutos en milisegundos

# Configuración para usar datos mock pero con cache Redis
external:
  api:
    alphavantage:
      enabled: false  # Mantenemos mock pero habilitamos cache

alpha-vantage:
  api:
    key: ${ALPHA_VANTAGE_API_KEY:demo}
    base-url: https://www.alphavantage.co/query
  cache:
    ttl: 300 # 5 minutos

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cache: DEBUG
    org.springframework.data.redis: DEBUG
