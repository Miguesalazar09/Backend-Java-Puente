spring:
  application:
    name: external-service
  
  profiles:
    active: mock  # Usar mock service temporalmente para probar sin Redis
  
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    enabled: false

# Redis configuration - solo para perfiles que no sean mock
---
spring:
  config:
    activate:
      on-profile: "!mock"
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: 6379
      timeout: 2000ms
      database: 0
  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes in milliseconds
      cache-null-values: false

server:
  port: 8083

external:
  api:
    alphavantage:
      base-url: https://www.alphavantage.co
      api-key: ${ALPHA_VANTAGE_API_KEY:RJGRZOIRR7VTEBYB}
      timeout: 10000

logging:
  level:
    com.example.externalservice: DEBUG
    org.springframework.cache: DEBUG
    root: INFO
